<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>최선생수학학원 · AI 자동채점</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0D1B2A;
    color: #fff;
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    padding: 20px 16px 40px;
  }
  .badge-top {
    display: inline-block;
    background: #F5C518;
    color: #0D1B2A;
    font-weight: 900;
    font-size: 10px;
    padding: 3px 12px;
    border-radius: 20px;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  h1 { font-size: 22px; font-weight: 900; }
  .header { text-align: center; margin-bottom: 24px; }
  .tab-row { display: flex; gap: 8px; margin-bottom: 24px; }
  .tab-btn {
    flex: 1; padding: 11px 18px; border-radius: 10px;
    border: 2px solid #1E3250; background: #152236;
    color: #5B7A9D; font-weight: 700; font-size: 13px;
    cursor: pointer; transition: all 0.15s;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .tab-btn.active-teacher { border-color: #F5C518; background: #F5C518; color: #0D1B2A; }
  .tab-btn.active-student { border-color: #60A5FA; background: #60A5FA; color: #0D1B2A; }
  .card {
    background: #152236;
    border: 1px solid #1E3250;
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .label-yellow { font-size: 11px; color: #F5C518; font-weight: 700; margin-bottom: 10px; }
  .label-blue { font-size: 11px; color: #60A5FA; font-weight: 700; margin-bottom: 10px; }
  input[type="text"], input[type="text"]:focus {
    width: 100%; padding: 11px 14px;
    background: #0D1B2A; border: 1px solid #1E3250;
    border-radius: 10px; color: #fff; font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none; margin-bottom: 8px;
  }
  input[type="text"]:last-child { margin-bottom: 0; }
  .upload-zone {
    border: 2px dashed #1E3250; border-radius: 10px;
    padding: 20px; text-align: center; cursor: pointer;
    min-height: 100px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
    transition: border-color 0.2s;
  }
  .upload-zone.has-image { border-color: #F5C518; }
  .upload-zone img { max-width: 100%; max-height: 180px; border-radius: 8px; }
  .upload-zone .icon { font-size: 28px; }
  .upload-zone .hint { color: #5B7A9D; font-size: 13px; }
  .action-btn {
    width: 100%; padding: 14px; border-radius: 12px;
    font-size: 15px; font-weight: 900; cursor: pointer;
    border: 2px solid transparent; margin-bottom: 16px;
    font-family: 'Noto Sans KR', sans-serif; transition: all 0.15s;
  }
  .action-btn.yellow { background: #F5C518; color: #0D1B2A; border-color: #F5C518; }
  .action-btn.blue { background: #60A5FA; color: #0D1B2A; }
  .action-btn.disabled { background: #152236; color: #5B7A9D; border-color: #1E3250; cursor: not-allowed; }
  .answers-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .answer-cell {
    background: #0D1B2A; border-radius: 8px;
    padding: 8px 6px; text-align: center;
  }
  .answer-cell .no { font-size: 10px; color: #5B7A9D; margin-bottom: 2px; }
  .answer-cell .val { font-size: 13px; font-weight: 700; color: #F5C518; }
  .save-btn {
    width: 100%; margin-top: 14px; padding: 12px;
    background: #22C55E; color: #0D1B2A;
    border: none; border-radius: 10px;
    font-size: 14px; font-weight: 900; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .save-btn.done { background: #0F3320; color: #22C55E; border: 2px solid #22C55E; }
  .book-item {
    padding: 10px 12px; border-radius: 10px;
    border: 2px solid #1E3250; cursor: pointer;
    margin-bottom: 6px; transition: all 0.15s;
  }
  .book-item.selected { border-color: #60A5FA; background: #0D2140; }
  .book-item .name { font-size: 13px; font-weight: 700; }
  .book-item .sub { font-size: 11px; color: #5B7A9D; }
  .answer-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .no-badge {
    min-width: 36px; text-align: center; font-size: 12px;
    font-weight: 700; color: #5B7A9D; background: #0D1B2A;
    padding: 6px 4px; border-radius: 6px; flex-shrink: 0;
  }
  .answer-row input[type="text"] { flex: 1; margin-bottom: 0; }
  .score-card {
    border-radius: 14px; padding: 20px;
    text-align: center; margin-bottom: 14px; border: 2px solid;
  }
  .score-num { font-size: 52px; font-weight: 900; line-height: 1; }
  .score-sub { font-size: 14px; color: #5B7A9D; margin-top: 6px; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    background: #0D2B1A; border: 1px solid #22C55E44;
    color: #22C55E; font-size: 12px; font-weight: 700;
    padding: 3px 10px; border-radius: 20px;
  }
  .wrong-row {
    display: flex; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid #1E3250; font-size: 13px;
  }
  .wrong-row:last-child { border-bottom: none; }
  .retry-btn {
    width: 100%; padding: 12px; background: #152236;
    color: #60A5FA; border: 2px solid #60A5FA;
    border-radius: 12px; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
  }
  .empty-box { text-align: center; padding: 32px; }
  .empty-box .icon { font-size: 32px; margin-bottom: 12px; }
  .empty-box .txt { color: #5B7A9D; font-size: 14px; }
  .empty-box .txt2 { color: #5B7A9D; font-size: 12px; margin-top: 4px; }
  .section { display: none; }
  .section.active { display: block; }
  .spinner { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  #api-key-wrap { margin-bottom: 20px; }
  .api-notice {
    background: #1A2E45; border: 1px solid #1E3250;
    border-radius: 10px; padding: 12px 14px; font-size: 12px;
    color: #5B7A9D; line-height: 1.7;
  }
  .api-notice b { color: #F5C518; }
</style>
</head>
<body>

<!-- 헤더 -->
<div class="header">
  <div class="badge-top">최선생수학학원 · AI 자동채점</div>
  <h1>스마트 채점 시스템</h1>
</div>

<!-- API 키 입력 -->
<div id="api-key-wrap">
  <div class="card">
    <div class="label-yellow">🔑 API 키 입력 (최초 1회)</div>
    <input type="text" id="apiKey" placeholder="Anthropic API Key (sk-ant-...)" />
    <div class="api-notice">
      <b>API 키는 내 기기에만 저장</b>되며 외부로 전송되지 않아요.<br>
      api.anthropic.com 에서 발급 가능해요.
    </div>
  </div>
</div>

<!-- 모드 탭 -->
<div class="tab-row">
  <button class="tab-btn active-teacher" onclick="switchMode('teacher')">👩‍🏫 선생님 모드</button>
  <button class="tab-btn" onclick="switchMode('student')">🎒 학생 모드</button>
</div>

<!-- 선생님 모드 -->
<div id="teacher-section" class="section active">
  <div class="card">
    <div class="label-yellow">📚 교재 정보 입력</div>
    <input type="text" id="bookName" placeholder="교재명 (예: 쎈 수학 중2)" />
    <input type="text" id="unitName" placeholder="단원 (예: 3단원 / p.45~52)" />
  </div>

  <div class="card">
    <div class="label-yellow">📷 정답 페이지 사진</div>
    <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImage(event)">
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('imageInput').click()">
      <div class="icon">📄</div>
      <div class="hint">교재 정답 페이지를 촬영해서 올려주세요</div>
    </div>
  </div>

  <button class="action-btn disabled" id="extractBtn" onclick="extractAnswers()">🤖 정답 자동 추출</button>

  <div class="card" id="answersCard" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="label-yellow" style="margin-bottom:0" id="answersLabel">✅ 추출된 정답</div>
      <button onclick="editAnswer()" style="font-size:11px;color:#5B7A9D;background:none;border:none;cursor:pointer;font-family:inherit">✏️ 수정</button>
    </div>
    <div class="answers-grid" id="answersGrid"></div>
    <button class="save-btn" id="saveBtn" onclick="saveAnswers()">💾 정답 저장하기</button>
  </div>

  <div class="card" id="savedListCard" style="display:none">
    <div class="label-yellow">📂 저장된 교재 정답</div>
    <div id="savedList"></div>
  </div>
</div>

<!-- 학생 모드 -->
<div id="student-section" class="section">
  <div class="card">
    <div class="label-blue">👤 학생 이름</div>
    <input type="text" id="studentName" placeholder="이름을 입력하세요" />
  </div>

  <div class="card">
    <div class="label-blue">📚 교재 선택</div>
    <div id="bookList"></div>
  </div>

  <div class="card" id="inputCard" style="display:none">
    <div class="label-blue" id="inputLabel">✏️ 답 입력</div>
    <div id="answerInputs"></div>
  </div>

  <button class="action-btn disabled" id="gradeBtn" onclick="gradeAnswers()">🤖 채점하기</button>

  <div id="resultArea"></div>
</div>

<script>
const NAVY="#0D1B2A",CARD="#152236",BORDER="#1E3250",YELLOW="#F5C518",GREEN="#22C55E",RED="#EF4444",MUTED="#5B7A9D";
let imageBase64=null, extractedAnswers=null, selectedBook=null, studentAnswers={};

// API 키 불러오기
window.onload = () => {
  const saved = localStorage.getItem('apiKey');
  if(saved) document.getElementById('apiKey').value = saved;
  document.getElementById('apiKey').addEventListener('change', () => {
    localStorage.setItem('apiKey', document.getElementById('apiKey').value.trim());
  });
  renderSavedList();
  renderBookList();
};

function getApiKey() {
  const k = document.getElementById('apiKey').value.trim();
  if(k) localStorage.setItem('apiKey', k);
  return k;
}

function switchMode(mode) {
  document.querySelectorAll('.tab-btn').forEach(b => b.className='tab-btn');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  if(mode==='teacher'){
    document.querySelectorAll('.tab-btn')[0].className='tab-btn active-teacher';
    document.getElementById('teacher-section').classList.add('active');
  } else {
    document.querySelectorAll('.tab-btn')[1].className='tab-btn active-student';
    document.getElementById('student-section').classList.add('active');
    renderBookList();
  }
}

function handleImage(e) {
  const file = e.target.files[0];
  if(!file) return;
  const zone = document.getElementById('uploadZone');
  zone.classList.add('has-image');
  zone.innerHTML = '<img src="'+URL.createObjectURL(file)+'" />';
  const reader = new FileReader();
  reader.onload = ev => {
    imageBase64 = ev.target.result.split(',')[1];
    document.getElementById('extractBtn').className='action-btn yellow';
    document.getElementById('extractBtn').textContent='🤖 정답 자동 추출';
  };
  reader.readAsDataURL(file);
}

async function callClaude(messages, isImage=false) {
  const key = getApiKey();
  if(!key) { alert('API 키를 입력해주세요!'); return null; }
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:1000, messages })
  });
  const data = await res.json();
  if(data.error) { alert('API 오류: '+data.error.message); return null; }
  return data.content.map(i=>i.text||'').join('');
}

async function extractAnswers() {
  if(!imageBase64) return;
  const btn = document.getElementById('extractBtn');
  btn.className='action-btn disabled';
  btn.textContent='⏳ AI가 정답 추출 중...';

  const prompt = `이것은 수학 교재의 정답 페이지 사진입니다.
사진에서 문제 번호와 정답을 모두 추출해주세요.
반드시 아래 JSON 형식으로만 응답하세요 (마크다운 없이):
{"answers":[{"no":"1","answer":"3"},{"no":"2","answer":"x=5"}]}
객관식은 번호(1~5), 단답형은 값, 서술형은 핵심 답만 추출해주세요.`;

  const text = await callClaude([{role:'user',content:[
    {type:'image',source:{type:'base64',media_type:'image/jpeg',data:imageBase64}},
    {type:'text',text:prompt}
  ]}]);

  btn.className='action-btn yellow';
  btn.textContent='🤖 정답 자동 추출';

  if(!text) return;
  try {
    const clean = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    extractedAnswers = parsed.answers;
    renderAnswersGrid();
  } catch { alert('정답 추출에 실패했어요. 사진을 다시 찍어주세요.'); }
}

function renderAnswersGrid() {
  if(!extractedAnswers||extractedAnswers.length===0) return;
  const card = document.getElementById('answersCard');
  card.style.display='block';
  document.getElementById('answersLabel').textContent=`✅ 추출된 정답 (${extractedAnswers.length}문제)`;
  const grid = document.getElementById('answersGrid');
  grid.innerHTML = extractedAnswers.map(a=>`
    <div class="answer-cell">
      <div class="no">${a.no}번</div>
      <div class="val">${a.answer}</div>
    </div>`).join('');
}

function editAnswer() {
  const input = prompt('수정할 번호와 정답 입력 (예: 3 = x+2)');
  if(!input) return;
  const [noStr, ans] = input.split('=').map(s=>s.trim());
  extractedAnswers = extractedAnswers.map(a=> a.no===noStr ? {...a,answer:ans} : a);
  renderAnswersGrid();
}

function saveAnswers() {
  const bookName = document.getElementById('bookName').value.trim();
  const unitName = document.getElementById('unitName').value.trim();
  if(!bookName) { alert('교재명을 입력해주세요!'); return; }
  if(!extractedAnswers) return;
  const key = 'answers_'+bookName+'_'+unitName;
  localStorage.setItem(key, JSON.stringify(extractedAnswers));
  const books = JSON.parse(localStorage.getItem('books')||'[]');
  const entry = {bookName,unit:unitName,key,count:extractedAnswers.length};
  const idx = books.findIndex(b=>b.key===key);
  if(idx>=0) books[idx]=entry; else books.push(entry);
  localStorage.setItem('books',JSON.stringify(books));
  const btn = document.getElementById('saveBtn');
  btn.className='save-btn done';
  btn.textContent='✅ 저장 완료! 학생들이 채점 가능해요';
  renderSavedList();
}

function renderSavedList() {
  const books = JSON.parse(localStorage.getItem('books')||'[]');
  const card = document.getElementById('savedListCard');
  const list = document.getElementById('savedList');
  if(books.length===0){ card.style.display='none'; return; }
  card.style.display='block';
  list.innerHTML = books.map(b=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid ${BORDER}">
      <div>
        <div style="font-size:13px;font-weight:700">${b.bookName}</div>
        <div style="font-size:11px;color:${MUTED}">${b.unit} · ${b.count}문제</div>
      </div>
      <div style="font-size:11px;color:${GREEN}">등록완료</div>
    </div>`).join('');
}

function renderBookList() {
  const books = JSON.parse(localStorage.getItem('books')||'[]');
  const list = document.getElementById('bookList');
  if(books.length===0){
    list.innerHTML=`<div class="empty-box"><div class="icon">📭</div><div class="txt">아직 등록된 교재가 없어요.</div><div class="txt2">선생님 모드에서 정답을 먼저 등록해주세요.</div></div>`;
    return;
  }
  list.innerHTML = books.map(b=>`
    <div class="book-item" id="book_${b.key}" onclick="selectBook(${JSON.stringify(b).replace(/"/g,'&quot;')})">
      <div class="name">${b.bookName}</div>
      <div class="sub">${b.unit} · ${b.count}문제</div>
    </div>`).join('');
}

function selectBook(book) {
  selectedBook = book;
  studentAnswers = {};
  document.querySelectorAll('.book-item').forEach(el=>el.classList.remove('selected'));
  document.getElementById('book_'+book.key).classList.add('selected');
  const answers = JSON.parse(localStorage.getItem(book.key)||'[]');
  const card = document.getElementById('inputCard');
  card.style.display='block';
  document.getElementById('inputLabel').textContent=`✏️ 답 입력 (${answers.length}문제)`;
  const inputs = document.getElementById('answerInputs');
  inputs.innerHTML = answers.map(a=>`
    <div class="answer-row">
      <div class="no-badge">${a.no}번</div>
      <input type="text" id="ans_${a.no}" placeholder="답 입력" oninput="updateStudentAnswer('${a.no}',this.value)" />
    </div>`).join('');
  document.getElementById('gradeBtn').className='action-btn blue';
  document.getElementById('resultArea').innerHTML='';
}

function updateStudentAnswer(no, val) {
  studentAnswers[no] = val;
}

async function gradeAnswers() {
  if(!selectedBook) return;
  const bookAnswers = JSON.parse(localStorage.getItem(selectedBook.key)||'[]');
  const filledAnswers = bookAnswers.filter(a => (studentAnswers[a.no]||'').trim());
  if(filledAnswers.length===0){ alert('답을 입력해주세요!'); return; }

  const btn = document.getElementById('gradeBtn');
  btn.className='action-btn disabled';
  btn.textContent='⏳ AI 채점 중...';

  const correct=[], wrong=[];

  for(const a of filledAnswers) {
    const studentAns = (studentAnswers[a.no]||'').trim();
    const prompt = `수학 채점을 해주세요.\n정답: ${a.answer}\n학생 답안: ${studentAns}\n수학적으로 동일한 값이면 정답으로 처리해주세요. (예: 1/2=0.5, x=3은 3)\nJSON으로만 응답: {"correct":true 또는 false}`;
    const text = await callClaude([{role:'user',content:prompt}]);
    if(!text){ wrong.push({no:a.no,correct:a.answer,student:studentAns}); continue; }
    try {
      const res = JSON.parse(text.replace(/```json|```/g,'').trim());
      if(res.correct) correct.push(a.no);
      else wrong.push({no:a.no,correct:a.answer,student:studentAns});
    } catch { wrong.push({no:a.no,correct:a.answer,student:studentAns}); }
  }

  btn.className='action-btn blue';
  btn.textContent='🤖 채점하기';

  const total = correct.length+wrong.length;
  const score = Math.round(correct.length/total*100);
  const scoreColor = score>=80 ? GREEN : score>=60 ? YELLOW : RED;
  const scoreBg = score>=80 ? '#0D2B1A' : score>=60 ? '#1A200A' : '#2B0D0D';
  const name = document.getElementById('studentName').value.trim() || '학생';

  document.getElementById('resultArea').innerHTML = `
    <div class="score-card" style="background:${scoreBg};border-color:${scoreColor}">
      <div style="font-size:13px;color:${MUTED};margin-bottom:4px">${name} · ${selectedBook.bookName}</div>
      <div class="score-num" style="color:${scoreColor}">${score}점</div>
      <div class="score-sub">${total}문제 중 ${correct.length}개 정답</div>
    </div>
    ${correct.length>0?`
    <div class="card">
      <div style="font-size:11px;color:${GREEN};font-weight:700;margin-bottom:8px">✅ 정답 (${correct.length}개)</div>
      <div class="tag-list">${correct.map(no=>`<span class="tag">${no}번</span>`).join('')}</div>
    </div>`:''}
    ${wrong.length>0?`
    <div class="card">
      <div style="font-size:11px;color:${RED};font-weight:700;margin-bottom:8px">❌ 오답 (${wrong.length}개)</div>
      ${wrong.map(w=>`<div class="wrong-row">
        <span style="color:${MUTED}">${w.no}번</span>
        <span><span style="color:${RED};margin-right:8px">내 답: ${w.student}</span><span style="color:${GREEN}">정답: ${w.correct}</span></span>
      </div>`).join('')}
    </div>`:''}
    <button class="retry-btn" onclick="retryGrade()">🔄 다시 채점하기</button>
  `;
}

function retryGrade() {
  document.getElementById('resultArea').innerHTML='';
  studentAnswers={};
  document.querySelectorAll('#answerInputs input').forEach(i=>i.value='');
}
</script>
</body>
</html>
